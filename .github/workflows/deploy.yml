name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main # Confirme se sua branch se chama main ou master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Transferir arquivos via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "." # Copia todos os arquivos do repositório
          target: "/home/ubuntu/lucronovolante" # ATENÇÃO: Troque pelo caminho real na sua VPS!