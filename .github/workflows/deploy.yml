name: Deploy to Oracle VPS

on:
  push:
    branches:
      - main # Confirme se sua branch se chama main ou master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Transferir arquivos via SSH
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          source: "."
          target: "/home/ubuntu/lucronovolante"

      - name: Instalar dependências e reiniciar servidor na VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
                    script: |
            set -e
            cd /home/ubuntu/lucronovolante

            echo "VITE_APPSHEET_APP_ID=${{ secrets.VITE_APPSHEET_APP_ID }}" > .env
            echo "VITE_APPSHEET_ACCESS_KEY=${{ secrets.VITE_APPSHEET_ACCESS_KEY }}" >> .env
            echo "VITE_APPSHEET_TABLE_NAME=${{ secrets.VITE_APPSHEET_TABLE_NAME }}" >> .env
            echo "GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}" >> .env

            npm install
            npm run build

            echo "=== Build OK - commit ${{ github.sha }} - $(date) ==="
            ls -la --time-style=long-iso dist/index.html

            pm2 restart lucronovolante --update-env || pm2 start npm --name "lucronovolante" -- run preview
            pm2 save
